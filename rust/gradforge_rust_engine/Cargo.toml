[package]
name = "gradforge_rust_engine"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gradforge_rust_engine"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.16"
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module", "abi3"] }
